<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policar - Painel Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce-slow { animation: bounce-slow 1.5s infinite; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-700 antialiased">

    <!-- LOGIN ADMIN -->
    <div id="login-admin-view" class="hidden min-h-screen bg-slate-100 flex items-center justify-center p-4">
        <div class="max-w-xs w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200 text-center space-y-4">
            <h2 class="font-bold text-slate-800 text-base">Acesso Policar</h2>
            <input type="text" id="admin-user" placeholder="Usuário" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-center focus:outline-none">
            <input type="password" id="admin-pass" placeholder="Senha" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-center focus:outline-none">
            <button onclick="verificarLogin()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-lg text-sm font-medium transition">Entrar</button>
        </div>
    </div>

    <!-- TELA CLIENTE -->
    <div id="app-cliente-view" class="hidden min-h-screen bg-slate-100 flex items-center justify-center p-4">
        <div id="cliente-tela-cadastro" class="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-8 space-y-6">
            <h2 class="text-xl font-bold text-slate-900 text-center">Policar Fidelidade</h2>
            <form onsubmit="cadastrarClienteFinal(event)" class="space-y-4 text-sm">
                <input type="text" id="cli-cad-nome" required placeholder="Nome Completo" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5">
                <input type="text" id="cli-cad-tel" required placeholder="WhatsApp" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5">
                <input type="text" id="cli-cad-aniversario" placeholder="dd/mm/aaaa" oninput="formatarData(this)" maxlength="10" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5">
                <button type="submit" class="w-full bg-slate-800 text-white py-3 rounded-lg font-medium">Acessar Meu Cartão ⭐</button>
            </form>
        </div>
        <div id="cliente-tela-cartao" class="hidden max-w-md w-full bg-white rounded-2xl border shadow-sm pb-5">
            <div id="cartao-fundo-banner" class="h-40 bg-slate-900 bg-cover bg-center rounded-t-2xl"></div>
            <div class="p-6 text-center">
                <h3 id="cartao-nome-cliente" class="font-bold text-lg"></h3>
                <div id="cartao-grid-selos" class="grid grid-cols-5 gap-2 my-4"></div>
                <button onclick="sairContaCliente()" class="text-xs text-slate-400 underline">Sair</button>
            </div>
        </div>
    </div>

    <!-- PAINEL ADMIN -->
    <div id="app-admin-view" class="hidden flex h-screen bg-slate-50">
        <div class="p-8 w-full text-center">
            <h1 class="text-2xl font-bold text-slate-800">Painel Administrativo Policar</h1>
            <button onclick="logoutAdmin()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded">Sair</button>
        </div>
    </div>

    <script>
        const USER_HASH = "cG9saWNhcg=="; 
        const PASS_HASH = "MTAyMDMw"; 
        
        window.addEventListener('DOMContentLoaded', () => {
            // FORÇA ATUALIZAÇÃO DE CACHE
            if (localStorage.getItem('fidelidade_versao') !== '1.1') {
                localStorage.clear();
                localStorage.setItem('fidelidade_versao', '1.1');
                location.reload();
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('cliente') === 'ver') {
                document.getElementById('app-cliente-view').classList.remove('hidden');
            } else if (localStorage.getItem('admin_policar_autenticado') === 'true') {
                document.getElementById('app-admin-view').classList.remove('hidden');
            } else {
                document.getElementById('login-admin-view').classList.remove('hidden');
            }
        });

        function formatarData(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2);
            if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9);
            input.value = v;
        }

        function verificarLogin() {
            const user = btoa(document.getElementById('admin-user').value.trim());
            const pass = btoa(document.getElementById('admin-pass').value.trim());
            if (user === USER_HASH && pass === PASS_HASH) {
                localStorage.setItem('admin_policar_autenticado', 'true');
                location.reload();
            } else {
                alert('Usuário ou senha incorretos!');
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_policar_autenticado');
            location.reload();
        }

        function sairContaCliente() {
            localStorage.removeItem('fidelidade_cliente_logado');
            location.reload();
        }
    </script>
</body>
</html>
